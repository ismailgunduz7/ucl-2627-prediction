# Fly.io host for the API (PLAN.md §13 Phase 7).
#
# The machine is deliberately never allowed to stop. Score polling and the
# token sweep are in-process timers, so a machine that scales to zero between
# requests would simply stop advancing the season: matches would stay on their
# last score and a published knockout draw would never be picked up.

app = 'ucl-2627-api'
primary_region = 'fra'          # Frankfurt, alongside the eu-central-1 database

[build]

[env]
  PORT = '8787'
  NODE_ENV = 'production'
  # Poll the provider in the background. The whole point of this host.
  SYNC_SCHEDULER_ENABLED = 'true'

[http_service]
  internal_port = 8787
  force_https = true
  auto_start_machines = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    path = '/health/ready'
    method = 'GET'
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
